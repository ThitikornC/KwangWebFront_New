name: Publish Cloudflare Worker

on:
  push:
    paths:
      - 'scripts/cloudflare/**'
      - 'wrangler.toml'
      - '.github/workflows/publish-worker.yml'

jobs:
  publish-worker:
    name: Publish Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm i --no-audit --no-fund; fi

      - name: Load .env from repository (optional)
        run: |
          if [ -f .env ]; then
            echo "Found .env — loading into environment (will override secrets if variables present)"
            set -o allexport
            # shellcheck disable=SC1091
            source .env
            set +o allexport
            # Only export expected vars to GITHUB_ENV to be used by subsequent steps
            if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> $GITHUB_ENV; fi
            if [ -n "$CF_ACCOUNT_ID" ]; then echo "CF_ACCOUNT_ID=$CF_ACCOUNT_ID" >> $GITHUB_ENV; fi
              if [ -n "$ZONE_ID" ]; then echo "ZONE_ID=$ZONE_ID" >> $GITHUB_ENV; fi
              if [ -n "$WRANGLER_ROUTE" ]; then echo "WRANGLER_ROUTE=$WRANGLER_ROUTE" >> $GITHUB_ENV; fi
              if [ -n "$BACKEND_API" ]; then echo "BACKEND_API=$BACKEND_API" >> $GITHUB_ENV; fi
              if [ -n "$BACKEND_BASE" ]; then echo "BACKEND_BASE=$BACKEND_BASE" >> $GITHUB_ENV; fi
          else
            echo ".env not found — using GitHub Secrets"
          fi

        - name: Inject environment values into wrangler.toml
          run: |
            echo "Injecting environment values into wrangler.toml"
            # Replace placeholders like ${CF_ACCOUNT_ID}, ${ZONE_ID}, ${WRANGLER_ROUTE}
            if [ -n "$CF_ACCOUNT_ID" ]; then
              sed -i "s/\${CF_ACCOUNT_ID}/$CF_ACCOUNT_ID/g" wrangler.toml || true
            fi
            if [ -n "$ZONE_ID" ]; then
              sed -i "s/\${ZONE_ID}/$ZONE_ID/g" wrangler.toml || true
            fi
            if [ -n "$WRANGLER_ROUTE" ]; then
              sed -i "s#\${WRANGLER_ROUTE}#$WRANGLER_ROUTE#g" wrangler.toml || true
            fi
            if [ -n "$BACKEND_API" ]; then
              sed -i "s#\${BACKEND_API}#$BACKEND_API#g" wrangler.toml || true
            fi
            if [ -n "$BACKEND_BASE" ]; then
              sed -i "s#\${BACKEND_BASE}#$BACKEND_BASE#g" wrangler.toml || true
            fi

      - name: Deploy Cloudflare Worker
        run: |
          npx --yes wrangler deploy --env production
